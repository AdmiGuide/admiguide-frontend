<!-- ==================== ÉTAT CHARGEMENT ==================== -->
<main class="px-4 py-8 md:px-8 lg:px-12">

    <section class="loading-background
           relative mx-auto max-w-3xl
           overflow-hidden rounded-3xl
           p-3 md:p-4">

        <!-- Carte glassmorphisme -->
        <div class="relative rounded-3xl
             border border-white/90
             bg-white/50
             px-7 py-10
             shadow-[0_16px_36px_rgba(38,43,39,0.06)]
             backdrop-blur-[8px]
             md:px-10 md:py-10" role="status" aria-live="polite">

            <!-- Indicateur de chargement -->
            <div class="mx-auto flex size-14
                items-center justify-center
                rounded-full bg-linen">

                <span class="size-5 animate-spin
                rounded-full
                border-2 border-terracotta
                border-t-transparent" aria-hidden="true"></span>
            </div>


            <!-- Message -->
            <div class="mt-5">

                <h1 class="text-3xl font-bold
                 leading-tight text-anthracite
                 md:text-4xl">
                    Nous préparons votre orientation.
                </h1>

                <p class="mt-7 max-w-2xl
                 text-base leading-7
                 text-anthracite/70">
                    Votre situation est prise en compte pour organiser les étapes
                    et les informations utiles.
                </p>

            </div>


            <!-- État -->
            <div class="mt-9 inline-flex
                items-center
                rounded-full
                bg-white/75
                px-4 py-2">

                <span class="text-xs text-anthracite/70">
                    Recherche des informations
                </span>

            </div>


            <!-- Annuler -->
            <div class="mt-7">

                <button type="button" (click)="cancelAnalysis()" class="cursor-pointer
                 text-sm font-bold
                 text-terracotta
                 transition hover:underline">
                    Annuler
                </button>

            </div>

        </div>

    </section>

</main>
