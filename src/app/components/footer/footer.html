<footer class="px-5 pb-5 pt-4 md:px-8 lg:px-12">

  <div class="mx-auto flex max-w-6xl flex-col gap-3
       border-t border-linen
       pt-5 text-xs text-anthracite/70
       md:flex-row md:items-center md:justify-between">

    <!-- Signature du service. -->
    <p>
      AdmiGuide · Une orientation, des étapes claires.
    </p>

    <!-- Liens complémentaires. -->
    <div class="flex flex-wrap items-center gap-x-5 gap-y-2">

      <button type="button" class="cursor-pointer font-semibold text-terracotta
               transition hover:opacity-80" (click)="openAbout()">
        À propos du service
      </button>

      <span>
        Sénégal & diaspora
      </span>

    </div>

  </div>

</footer>


<!-- ==================== MODALE À PROPOS ==================== -->
@if (isAboutOpen) {

<div class="fixed inset-0 z-[200]
         flex items-center justify-center
         bg-anthracite/35
         px-4
         backdrop-blur-sm" (click)="closeAbout()">

  <!-- Fenêtre -->
  <section class="w-full max-w-xl
           rounded-3xl bg-white
           px-6 py-7
           shadow-2xl
           md:px-8 md:py-8" role="dialog" aria-modal="true" aria-labelledby="about-title"
    (click)="$event.stopPropagation()">

    <!-- Titre + fermeture -->
    <div class="flex items-start justify-between gap-5">

      <h2 id="about-title" class="text-2xl font-bold text-anthracite
               md:text-[26px]">
        Une aide pour vous orienter
      </h2>

      <button type="button" class="flex size-11 shrink-0 cursor-pointer
               items-center justify-center
               rounded-xl border border-linen
               bg-white text-anthracite/70
               transition hover:bg-cream" aria-label="Fermer" (click)="closeAbout()">

        <svg lucideX class="size-5" aria-hidden="true">
        </svg>

      </button>

    </div>


    <!-- Présentation -->
    <p class="mt-7 text-sm leading-6 text-anthracite/70">
      AdmiGuide aide à comprendre les étapes d'une démarche.
      La plateforme ne remplace pas les administrations et ne dépose
      aucun dossier à votre place.
    </p>


    <!-- Actions -->
    <div class="mt-7 flex items-center justify-between gap-4">

      <button type="button" class="cursor-pointer rounded-xl
               border border-linen bg-white
               px-5 py-3
               text-sm font-semibold text-anthracite/80
               transition hover:bg-cream" (click)="closeAbout()">
        Fermer
      </button>


      <a routerLink="/orientation" class="rounded-xl bg-terracotta
               px-5 py-3
               text-sm font-semibold text-white
               shadow-md
               transition hover:opacity-90" (click)="closeAbout()">
        Décrire ma situation
      </a>

    </div>

  </section>

</div>

}
